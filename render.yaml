# Fair Measure on Render (free web + static + Postgres + Key Value).
# After this file is on the default branch, open:
#   https://render.com/deploy?repo=https://github.com/sebenga/fair-measure
# Free Postgres expires after 30 days unless you upgrade.

envVarGroups:
  - name: fairmeasure-v2-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true

databases:
  - name: fairmeasure-v2-db
    plan: free
    region: frankfurt
    databaseName: fairmeasure
    user: fairmeasure

services:
  - type: keyvalue
    name: fairmeasure-v2-kv
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: fairmeasure-v2-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    initialDeployHook: python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - fromGroup: fairmeasure-v2-secrets
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        value: fairmeasure-v2-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fairmeasure-v2-app.onrender.com
      - key: PUBLIC_APP_ORIGIN
        value: https://fairmeasure-v2-app.onrender.com
      - key: PUBLIC_API_ORIGIN
        value: https://fairmeasure-v2-api.onrender.com
      - key: SEARCH_ENABLED
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fairmeasure-v2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fairmeasure-v2-kv
          type: keyvalue
          property: connectionString

  - type: web
    name: fairmeasure-v2-realtime
    runtime: node
    plan: free
    region: frankfurt
    rootDir: realtime
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - fromGroup: fairmeasure-v2-secrets
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: "1"
      - key: REALTIME_CORS_ORIGINS
        value: https://fairmeasure-v2-app.onrender.com
      - key: DJANGO_INTERNAL_BASE_URL
        value: https://fairmeasure-v2-api.onrender.com
      - key: REDIS_URL
        fromService:
          name: fairmeasure-v2-kv
          type: keyvalue
          property: connectionString

  - type: web
    name: fairmeasure-v2-app
    runtime: static
    region: frankfurt
    rootDir: frontend
    buildCommand: npm ci && node scripts/write-render-env.mjs && npm run build:prod
    staticPublishPath: www/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048
      - key: FRONTEND_API_BASE_URL
        value: https://fairmeasure-v2-api.onrender.com/api/v1
      - key: FRONTEND_REALTIME_URL
        value: https://fairmeasure-v2-realtime.onrender.com
