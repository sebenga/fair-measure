# One Docker web service (app + API) + Postgres + Key Value.
# New → Blueprint → sebenga/fair-measure, or create a Docker web service
# pointing at this repo with Dockerfile ./Dockerfile.

envVarGroups:
  - name: fairmeasure-v2-secrets
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: INTERNAL_API_TOKEN
        generateValue: true

databases:
  - name: fairmeasure-v2-db
    plan: free
    region: frankfurt
    databaseName: fairmeasure
    user: fairmeasure

services:
  - type: keyvalue
    name: fairmeasure-v2-kv
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: fairmeasure-v2
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - fromGroup: fairmeasure-v2-secrets
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: fairmeasure-v2.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fairmeasure-v2.onrender.com
      - key: PUBLIC_APP_ORIGIN
        value: https://fairmeasure-v2.onrender.com
      - key: PUBLIC_API_ORIGIN
        value: https://fairmeasure-v2.onrender.com
      - key: SEARCH_ENABLED
        value: "false"
      - key: SECURE_SSL_REDIRECT
        value: "false"
      - key: SPA_DIR
        value: /app/spa
      - key: DATABASE_URL
        fromDatabase:
          name: fairmeasure-v2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: fairmeasure-v2-kv
          type: keyvalue
          property: connectionString
