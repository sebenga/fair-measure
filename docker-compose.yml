name: fair-measure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairmeasure
      POSTGRES_USER: fairmeasure
      POSTGRES_PASSWORD: fairmeasure
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fairmeasure -d fairmeasure']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Search is optional in development; the API falls back to Postgres queries
  # when SEARCH_ENABLED is false.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-fairmeasure-dev-key}
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data
    profiles: ['search']

  # An S3-compatible store so uploads can be exercised without a Cloudflare or
  # AWS account. Point STORAGE_ENDPOINT_URL at http://localhost:9000 to use it.
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fairmeasure
      MINIO_ROOT_PASSWORD: fairmeasure
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    profiles: ['storage']

volumes:
  postgres-data:
  redis-data:
  meili-data:
  minio-data:
