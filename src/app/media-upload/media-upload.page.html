<ion-header>
  <ion-toolbar class="sporty-header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1" class="sporty-back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="sporty-title">
      <div class="title-content">
        <span class="media-icon">📱</span>
        <span class="title-text">MEDIA UPLOAD</span>
        <span class="upload-icon">⬆️</span>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="sporty-content">
  <div class="upload-hero">
    <div class="hero-background">
      <div class="media-wave wave-1"></div>
      <div class="media-wave wave-2"></div>
      <div class="media-wave wave-3"></div>
    </div>
    <div class="hero-content">
      <div class="logo-container">
        <svg width="64" height="48" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="hero-logo">
          <ellipse cx="16" cy="16" rx="7" ry="9" fill="#fff" stroke="#fff" stroke-width="2" />
          <ellipse cx="32" cy="16" rx="7" ry="9" fill="#fff" stroke="#fff" stroke-width="2" />
          <circle cx="16" cy="16" r="3" fill="#ff8800" />
          <circle cx="32" cy="16" r="3" fill="#ff8800" />
          <path d="M8 10 Q24 2 40 10" stroke="#fff" stroke-width="2" fill="none" />
        </svg>
      </div>
      <h1 class="hero-title">Share Your Moments</h1>
      <p class="hero-subtitle">Upload pictures and videos from your competitions</p>
    </div>
  </div>

  <app-media-upload></app-media-upload>
</ion-content>
