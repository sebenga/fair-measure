<div class="profile-container">
  <ion-list class="profile-card">
    <ion-item lines="none">
      <ion-avatar slot="start" class="profile-avatar">
        <img src="https://via.placeholder.com/80?text=User" alt="User Avatar" />
      </ion-avatar>
    </ion-item>
    <ion-item lines="none">
      <h2 style="margin:0; font-size:1.2em; font-weight:600;">John Doe</h2>
    </ion-item>
    <ion-item lines="none">
      <p style="margin:0; color:#888;">&#64;johndoe</p>
    </ion-item>
    <ion-item lines="none">
      <p style="margin:0;">Bio: Enthusiastic football fan. Loves competitions!</p>
    </ion-item>
    <ion-item lines="none">
      <ion-button expand="block" color="primary">Edit Profile</ion-button>
    </ion-item>
  </ion-list>
  <ion-list class="profile-menu">
    <ion-item><ion-icon name="home-outline" slot="start"></ion-icon>Home</ion-item>
    <ion-item><ion-icon name="people-outline" slot="start"></ion-icon>Friends</ion-item>
    <ion-item><ion-icon name="settings-outline" slot="start"></ion-icon>Settings</ion-item>
  </ion-list>
</div>
