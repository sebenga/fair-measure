<ion-content class="auth-content">
  <div class="auth-container">
    <!-- Background Elements -->
    <div class="auth-background">
      <div class="bg-wave wave-1"></div>
      <div class="bg-wave wave-2"></div>
      <div class="bg-wave wave-3"></div>
    </div>

    <!-- Header Section -->
    <div class="auth-header" [@fadeIn]>
      <div class="logo-container">
        <svg width="80" height="60" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="auth-logo">
          <ellipse cx="16" cy="16" rx="7" ry="9" fill="#ff8800" stroke="#ff8800" stroke-width="2" />
          <ellipse cx="32" cy="16" rx="7" ry="9" fill="#ff8800" stroke="#ff8800" stroke-width="2" />
          <circle cx="16" cy="16" r="3" fill="#fff" />
          <circle cx="32" cy="16" r="3" fill="#fff" />
          <path d="M8 10 Q24 2 40 10" stroke="#ff8800" stroke-width="2" fill="none" />
        </svg>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your championship journey</p>
    </div>

    <!-- Login Form -->
    <div class="auth-form" [@slideInUp]>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <!-- Email Field -->
        <div class="form-group">
          <div class="input-container">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              type="email"
              class="auth-input"
              [(ngModel)]="loginData.email"
              name="email"
              placeholder="Email address"
              required
              email
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="input-container">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="auth-input"
              [(ngModel)]="loginData.password"
              name="password"
              placeholder="Password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-password">
          <a href="#" class="forgot-link">Forgot your password?</a>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="auth-btn primary-btn"
          [disabled]="!loginForm.form.valid || isLoading"
          [class.loading]="isLoading"
        >
          <div class="btn-background">
            <div class="btn-wave"></div>
          </div>
          <div class="btn-content">
            <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
            <span *ngIf="!isLoading">Sign In</span>
            <span *ngIf="isLoading">Signing In...</span>
          </div>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="divider-line"></span>
        <span class="divider-text">or continue with</span>
        <span class="divider-line"></span>
      </div>

      <!-- Social Login Buttons -->
      <div class="social-buttons">
        <button
          class="social-btn google-btn"
          (click)="onSocialLogin('google')"
          [disabled]="isLoading"
        >
          <ion-icon name="logo-google"></ion-icon>
          <span>Google</span>
        </button>

        <button
          class="social-btn facebook-btn"
          (click)="onSocialLogin('facebook')"
          [disabled]="isLoading"
        >
          <ion-icon name="logo-facebook"></ion-icon>
          <span>Facebook</span>
        </button>

        <button
          class="social-btn linkedin-btn"
          (click)="onSocialLogin('linkedin')"
          [disabled]="isLoading"
        >
          <ion-icon name="logo-linkedin"></ion-icon>
          <span>LinkedIn</span>
        </button>
      </div>

      <!-- Register Link -->
      <div class="auth-footer">
        <p class="footer-text">
          Don't have an account?
          <button class="link-btn" (click)="goToRegister()">Sign up here</button>
        </p>
      </div>
    </div>
  </div>

  <!-- Toast Messages -->
  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    position="top"
    (didDismiss)="showToast = false"
  ></ion-toast>
</ion-content>
