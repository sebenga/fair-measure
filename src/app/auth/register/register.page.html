<ion-content class="auth-content">
  <div class="auth-container">
    <!-- Background Elements -->
    <div class="auth-background">
      <div class="bg-wave wave-1"></div>
      <div class="bg-wave wave-2"></div>
      <div class="bg-wave wave-3"></div>
    </div>

    <!-- Header Section -->
    <div class="auth-header" [@fadeIn]>
      <div class="logo-container">
        <svg width="80" height="60" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="auth-logo">
          <ellipse cx="16" cy="16" rx="7" ry="9" fill="#ff8800" stroke="#ff8800" stroke-width="2" />
          <ellipse cx="32" cy="16" rx="7" ry="9" fill="#ff8800" stroke="#ff8800" stroke-width="2" />
          <circle cx="16" cy="16" r="3" fill="#fff" />
          <circle cx="32" cy="16" r="3" fill="#fff" />
          <path d="M8 10 Q24 2 40 10" stroke="#ff8800" stroke-width="2" fill="none" />
        </svg>
      </div>
      <h1 class="auth-title">Join Fair-Measure</h1>
      <p class="auth-subtitle">Create your account and start competing</p>
    </div>

    <!-- Registration Form -->
    <div class="auth-form" [@slideInUp]>
      <form (ngSubmit)="onRegister()" #registerForm="ngForm">
        <!-- Name Fields -->
        <div class="name-row">
          <div class="form-group half-width">
            <div class="input-container">
              <ion-icon name="person-outline" class="input-icon"></ion-icon>
              <input
                type="text"
                class="auth-input"
                [(ngModel)]="registerData.firstName"
                name="firstName"
                placeholder="First name"
                required
              />
            </div>
          </div>

          <div class="form-group half-width">
            <div class="input-container">
              <ion-icon name="person-outline" class="input-icon"></ion-icon>
              <input
                type="text"
                class="auth-input"
                [(ngModel)]="registerData.lastName"
                name="lastName"
                placeholder="Last name"
                required
              />
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <div class="input-container">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              type="email"
              class="auth-input"
              [(ngModel)]="registerData.email"
              name="email"
              placeholder="Email address"
              required
              email
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="input-container">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="auth-input"
              [(ngModel)]="registerData.password"
              name="password"
              placeholder="Password (min. 6 characters)"
              required
              minlength="6"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('password')"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <div class="input-container">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="auth-input"
              [(ngModel)]="registerData.confirmPassword"
              name="confirmPassword"
              placeholder="Confirm password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility('confirmPassword')"
            >
              <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="terms-agreement">
          <div class="checkbox-container">
            <ion-checkbox
              [(ngModel)]="agreeToTerms"
              name="agreeToTerms"
              class="terms-checkbox"
            ></ion-checkbox>
            <label class="terms-label">
              I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
            </label>
          </div>
        </div>

        <!-- Register Button -->
        <button
          type="submit"
          class="auth-btn primary-btn"
          [disabled]="!registerForm.form.valid || !agreeToTerms || isLoading"
          [class.loading]="isLoading"
        >
          <div class="btn-background">
            <div class="btn-wave"></div>
          </div>
          <div class="btn-content">
            <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
            <span *ngIf="!isLoading">Create Account</span>
            <span *ngIf="isLoading">Creating Account...</span>
          </div>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="divider-line"></span>
        <span class="divider-text">or sign up with</span>
        <span class="divider-line"></span>
      </div>

      <!-- Social Registration Buttons -->
      <div class="social-buttons">
        <button
          class="social-btn google-btn"
          (click)="onSocialRegister('google')"
          [disabled]="isLoading"
        >
          <ion-icon name="logo-google"></ion-icon>
          <span>Google</span>
        </button>

        <button
          class="social-btn facebook-btn"
          (click)="onSocialRegister('facebook')"
          [disabled]="isLoading"
        >
          <ion-icon name="logo-facebook"></ion-icon>
          <span>Facebook</span>
        </button>

        <button
          class="social-btn linkedin-btn"
          (click)="onSocialRegister('linkedin')"
          [disabled]="isLoading"
        >
          <ion-icon name="logo-linkedin"></ion-icon>
          <span>LinkedIn</span>
        </button>
      </div>

      <!-- Login Link -->
      <div class="auth-footer">
        <p class="footer-text">
          Already have an account?
          <button class="link-btn" (click)="goToLogin()">Sign in here</button>
        </p>
      </div>
    </div>
  </div>

  <!-- Toast Messages -->
  <ion-toast
    [isOpen]="showToast"
    [message]="toastMessage"
    [duration]="3000"
    [color]="toastColor"
    position="top"
    (didDismiss)="showToast = false"
  ></ion-toast>
</ion-content>
