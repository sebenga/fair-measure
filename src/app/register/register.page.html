<ion-content class="auth-content">
  <div class="auth-container">
    <h1>Register</h1>
    <form (ngSubmit)="onSubmit()">
      <ion-item>
        <ion-label position="floating">Name</ion-label>
        <ion-input type="text" required [(ngModel)]="name" name="name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" required [(ngModel)]="email" name="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" required [(ngModel)]="password" name="password"></ion-input>
      </ion-item>
      <ion-button expand="block" color="primary" type="submit" [disabled]="loading">Register</ion-button>
    </form>
    <div *ngIf="error" class="auth-error">{{ error }}</div>
    <div *ngIf="loading" class="auth-loading">Registering...</div>
    <div class="auth-divider">or</div>
    <ion-button expand="block" class="google-btn">
      <ion-icon name="logo-google" slot="start"></ion-icon>
      Register with Google
    </ion-button>
    <ion-button expand="block" class="facebook-btn">
      <ion-icon name="logo-facebook" slot="start"></ion-icon>
      Register with Facebook
    </ion-button>
    <ion-button expand="block" class="linkedin-btn">
      <ion-icon name="logo-linkedin" slot="start"></ion-icon>
      Register with LinkedIn
    </ion-button>
    <div class="auth-switch">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</ion-content>
