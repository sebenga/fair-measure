<ion-content class="auth-content">
  <div class="auth-container">
    <h1>Login</h1>
    <form>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input type="email" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input type="password" required></ion-input>
      </ion-item>
      <ion-button expand="block" color="primary" type="submit">Login</ion-button>
    </form>
    <div class="auth-divider">or</div>
    <ion-button expand="block" color="light" class="google-btn">
      <ion-icon name="logo-google" slot="start"></ion-icon>
      Login with Google
    </ion-button>
    <ion-button expand="block" color="light" class="linkedin-btn">
      <ion-icon name="logo-linkedin" slot="start"></ion-icon>
      Login with LinkedIn
    </ion-button>
    <ion-button expand="block" color="light" class="facebook-btn">
      <ion-icon name="logo-facebook" slot="start"></ion-icon>
      Login with Facebook
    </ion-button>
    <div class="auth-switch">
      Don't have an account? <a routerLink="/register">Register</a>
    </div>
  </div>
</ion-content>
