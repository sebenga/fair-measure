<ion-header class="fb-header">
  <ion-toolbar>
    <div class="fb-header-content">
      <ion-title class="fb-logo">FairBook</ion-title>
      <div class="fb-tabs">
        <ion-button fill="clear" class="fb-tab"><ion-icon name="home-outline"></ion-icon><span class="tab-label">Home</span></ion-button>
        <ion-button fill="clear" class="fb-tab"><ion-icon name="people-outline"></ion-icon><span class="tab-label">Friends</span></ion-button>
        <ion-button fill="clear" class="fb-tab"><ion-icon name="chatbubble-outline"></ion-icon><span class="tab-label">Groups</span></ion-button>
        <ion-button fill="clear" class="fb-tab"><ion-icon name="notifications-outline"></ion-icon><span class="tab-label">Notifications</span></ion-button>
        <ion-button fill="clear" class="fb-tab"><ion-icon name="person-circle-outline"></ion-icon><span class="tab-label">Profile</span></ion-button>
      </div>
      <ion-searchbar class="fb-search" placeholder="Search competitions, teams, posts..."></ion-searchbar>
    </div>
  </ion-toolbar>
</ion-header>
