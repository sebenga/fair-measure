<ion-header class="fb-header">
  <ion-toolbar>
    <div class="fb-header-content merged-header">
         <ion-title class="fb-logo">
          <span class="logo-icon" aria-label="Fair-Measure logo" style="vertical-align: middle; margin-left: 8px;">
            <svg width="48" height="32" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Eye shapes -->
              <ellipse cx="16" cy="16" rx="7" ry="9" fill="#ff8800" stroke="#ff8800" stroke-width="2" />
              <ellipse cx="32" cy="16" rx="7" ry="9" fill="#ff8800" stroke="#ff8800" stroke-width="2" />
              <!-- Pupils -->
              <circle cx="16" cy="16" r="3" fill="#fff" />
              <circle cx="32" cy="16" r="3" fill="#fff" />
              <!-- Monitoring arc -->
              <path d="M8 10 Q24 2 40 10" stroke="#ff8800" stroke-width="2" fill="none" />
            </svg>
        </span>
        Fair-Measure
      </ion-title>
      <div class="fb-tabs" style="justify-content:center;">
        <ion-button fill="clear" class="fb-tab">
          <span class="tab-svg" aria-label="Home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 11L12 3l9 8" stroke="#1877f2" stroke-width="2" fill="none"/><rect x="7" y="11" width="10" height="8" rx="2" fill="#f0f2f5" stroke="#1877f2" stroke-width="2"/></svg>
          </span>
          <span class="tab-label">Home</span>
        </ion-button>
        <ion-button fill="clear" class="fb-tab">
          <span class="tab-svg" aria-label="Friends">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="10" r="3" fill="#ff8800"/><circle cx="16" cy="10" r="3" fill="#ff8800"/><rect x="4" y="15" width="12" height="5" rx="2" fill="#f0f2f5" stroke="#ff8800" stroke-width="2"/></svg>
          </span>
          <span class="tab-label">Friends</span>
        </ion-button>
        <ion-button fill="clear" class="fb-tab">
          <span class="tab-svg" aria-label="Groups">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="3" fill="#1877f2"/><circle cx="6" cy="14" r="2" fill="#1877f2"/><circle cx="18" cy="14" r="2" fill="#1877f2"/></svg>
          </span>
          <span class="tab-label">Groups</span>
        </ion-button>
        <ion-button fill="clear" class="fb-tab">
          <span class="tab-svg" aria-label="Notifications">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21c1.1 0 2-.9 2-2H10c0 1.1.9 2 2 2zm6-6V9a6 6 0 10-12 0v6l-2 2v1h16v-1l-2-2z" fill="#ff8800"/></svg>
          </span>
          <span class="tab-label">Notifications</span>
        </ion-button>
        <ion-button fill="clear" class="fb-tab">
          <span class="tab-svg" aria-label="Profile">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#1877f2"/><rect x="6" y="14" width="12" height="6" rx="3" fill="#f0f2f5" stroke="#1877f2" stroke-width="2"/></svg>
          </span>
          <span class="tab-label">Profile</span>
        </ion-button>
      </div>
      <ion-searchbar class="fb-search" placeholder="Search  "></ion-searchbar>
      <div class="header-actions">
        <button class="auth-btn login-btn" onclick="window.location.href='/auth/login'">
          <span>Login</span>
        </button>
        <button class="auth-btn register-btn" onclick="window.location.href='/auth/register'">
          <span>Sign Up</span>
        </button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
